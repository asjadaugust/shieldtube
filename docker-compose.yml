services:
  shieldtube-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - /mnt/nas/shieldtube/cache:/app/cache
      - ./data:/app/data
      - ./config/certs:/app/config/certs:ro
      - ./backend/config/cookies.txt:/app/config/cookies.txt
    environment:
      - CACHE_DIR=/app/cache
      - DB_PATH=/app/data/shieldtube.db
      - FFMPEG_THREADS=${FFMPEG_THREADS:-2}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - API_SECRET=${API_SECRET:-}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-}
      - YTDLP_COOKIES_PATH=/app/config/cookies.txt
      - YTDLP_PROXY=${YTDLP_PROXY:-}
    restart: unless-stopped
    init: true
    cpu_count: 2
    cpu_shares: 256

  nginx:
    image: nginx:alpine
    ports:
      - "9443:9443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/certs:/etc/nginx/certs:ro
    depends_on:
      shieldtube-api:
        condition: service_started
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --edge-ip-version 4 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    network_mode: "service:shieldtube-api"
    depends_on:
      shieldtube-api:
        condition: service_started
