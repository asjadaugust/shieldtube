<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#76B900">
  <meta name="description" content="ShieldTube - Remote control & training for your Shield TV">

  <title>ShieldTube</title>

  <link rel="manifest" href="/mobile/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/mobile/icons/icon-192.svg">
  <link rel="apple-touch-icon" href="/mobile/icons/icon-192.svg">

  <link rel="stylesheet" href="/mobile/css/theme.css">
  <link rel="stylesheet" href="/mobile/css/app.css">
</head>
<body>
  <!-- Setup Modal -->
  <div id="setup-modal" class="setup-modal" hidden>
    <div class="setup-modal__backdrop"></div>
    <div class="setup-modal__content">
      <div class="setup-modal__logo">
        <img src="/mobile/icons/icon-192.svg" alt="ShieldTube" width="72" height="72">
      </div>
      <h1 class="setup-modal__title">Welcome to ShieldTube</h1>
      <p class="setup-modal__subtitle">Connect to your ShieldTube backend to get started.</p>

      <form id="setup-form" class="setup-form">
        <div class="form-group">
          <label for="setup-url">Backend URL</label>
          <input
            type="url"
            id="setup-url"
            placeholder="http://192.168.1.100:8080"
            autocomplete="url"
            required
          >
          <span class="form-hint">Your ShieldTube server address</span>
        </div>

        <div class="form-group">
          <label for="setup-secret">API Secret</label>
          <input
            type="password"
            id="setup-secret"
            placeholder="Enter your shared secret"
            autocomplete="off"
            required
          >
          <span class="form-hint">Shared secret from your .env file</span>
        </div>

        <div id="setup-status" class="setup-status" hidden></div>

        <button type="button" id="setup-test-btn" class="btn btn--outline">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
          Test Connection
        </button>

        <button type="submit" id="setup-save-btn" class="btn btn--primary" disabled>
          Get Started
        </button>
      </form>
    </div>
  </div>

  <!-- App Shell -->
  <div id="app" class="app">
    <!-- Content Area -->
    <main id="content" class="content"></main>

    <!-- Loading Spinner -->
    <div id="loading-overlay" class="loading-overlay" hidden>
      <div class="spinner"></div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Bottom Sheet -->
    <div id="bottom-sheet" class="bottom-sheet" hidden>
      <div class="bottom-sheet__backdrop"></div>
      <div class="bottom-sheet__panel">
        <div class="bottom-sheet__handle"></div>
        <div id="bottom-sheet-content" class="bottom-sheet__content"></div>
      </div>
    </div>

    <!-- Player Overlay -->
    <div id="player-overlay" class="player-overlay" hidden>
      <div id="player-container" class="player-container"></div>
    </div>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav" class="bottom-nav">
      <a href="#home" class="bottom-nav__item active" data-tab="home">
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        <span class="bottom-nav__label">Home</span>
      </a>
      <a href="#search" class="bottom-nav__item" data-tab="search">
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <span class="bottom-nav__label">Search</span>
      </a>
      <a href="#train" class="bottom-nav__item" data-tab="train">
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <span class="bottom-nav__label">Train</span>
      </a>
      <a href="#settings" class="bottom-nav__item" data-tab="settings">
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
        <span class="bottom-nav__label">Settings</span>
      </a>
    </nav>
  </div>

  <script src="/mobile/js/api.js"></script>
  <script src="/mobile/js/components.js"></script>
  <script src="/mobile/js/player.js"></script>
  <script src="/mobile/js/swipe.js"></script>
  <script src="/mobile/js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/mobile/sw.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.warn('SW registration failed:', err));
    }
  </script>
</body>
</html>
